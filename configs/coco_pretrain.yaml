# Stage 1: COCO person boxes with random rotation, 90 epochs.
_base_: base.yaml
name: coco_pretrain_dla34_512
train:
  epochs: 90
  batch_size: 64
  save_epochs: [10, 20, 30, 40, 50, 60, 70, 80, 90]
data:
  train:
    - {type: coco, split: train2017, skip_crowd_images: true}
  # Monitoring only (the final epoch is always used; these sets never select a model).
  # Built by `tools/prepare_data.py monitor`.
  test:
    - {type: json, name: coco_val500, img_dir: data/coco/val2017,
       ann: data/coco/annotations/person_val2017_monitor500.json}
    - {type: json, name: habbof_every10, img_dir: data/fisheye/HABBOF,
       ann: data/fisheye/habbof_every10_monitor.json}
eval:
  interval: 10
  save_dets: false
